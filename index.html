<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>影像版本评审 · 多模式对比</title>
  <style>
    :root {
      --bg: #f3f5f7;
      --panel: #ffffff;
      --ink: #17202a;
      --muted: #71808f;
      --line: #e4e9ee;
      --line-strong: #ccd5de;
      --navy: #26394c;
      --blue: #2563eb;
      --blue-soft: #e9f0ff;
      --coral: #e45b51;
      --gold: #c98813;
      --shadow: 0 12px 28px rgba(23, 32, 42, .08);
      font-family: Inter, "Microsoft YaHei", system-ui, -apple-system, sans-serif;
      color: var(--ink);
      background: var(--bg);
      font-synthesis: none;
    }

    * { box-sizing: border-box; }
    html, body { height: 100%; margin: 0; }
    body { overflow: hidden; }
    button, input { font: inherit; }
    button { cursor: pointer; }

    .app { height: 100vh; display: flex; flex-direction: column; }
    .topbar {
      flex: 0 0 auto; min-height: 72px; display: flex; align-items: center;
      justify-content: space-between; gap: 18px; padding: 0 24px;
      background: rgba(255,255,255,.96); border-bottom: 1px solid var(--line);
      position: relative; z-index: 40;
    }
    .brand { min-width: 0; display: flex; align-items: center; gap: 12px; }
    .brand-mark { width: 38px; height: 38px; display: grid; place-items: center; flex: 0 0 auto; border-radius: 9px; color: #fff; background: var(--navy); font-size: 20px; }
    .brand h1 { margin: 0; font-size: 18px; line-height: 1.2; letter-spacing: 0; }
    .brand p { margin: 5px 0 0; color: var(--muted); font-size: 12px; }
    .toolbar { display: flex; align-items: center; gap: 10px; }
    .segmented { display: inline-flex; padding: 3px; border: 1px solid var(--line-strong); border-radius: 8px; background: #f8fafb; }
    .segmented button { border: 0; border-radius: 6px; background: transparent; color: var(--muted); padding: 8px 14px; font-size: 13px; font-weight: 700; }
    .segmented button.active { color: #fff; background: var(--navy); box-shadow: 0 2px 7px rgba(32,49,68,.16); }
    .search { width: 190px; height: 36px; display: flex; align-items: center; gap: 8px; padding: 0 10px; border: 1px solid var(--line-strong); border-radius: 7px; background: #fff; color: var(--muted); }
    .search svg { width: 16px; height: 16px; flex: 0 0 auto; }
    .search input { width: 100%; border: 0; outline: 0; color: var(--ink); background: transparent; font-size: 13px; }
    .search input::placeholder { color: #9aa5af; }

    .workspace { min-height: 0; flex: 1; overflow: auto; padding: 18px 18px 30px; }
    .matrix-shell { width: 100%; min-width: 0; border: 1px solid var(--line); border-radius: 8px; background: var(--panel); box-shadow: var(--shadow); overflow: hidden; }
    .matrix-header, .scene-row { display: grid; grid-template-columns: clamp(48px, 5vw, 64px) repeat(8, minmax(0, 1fr)); }
    .matrix-shell.third-party { width: 100%; min-width: 0; }
    .matrix-header.third-party, .scene-row.third-party { grid-template-columns: clamp(48px, 5vw, 64px) repeat(6, minmax(0, 1fr)); }
    .matrix-header { position: sticky; top: 0; z-index: 20; }
    .header-group, .header-sub { display: flex; align-items: center; justify-content: center; border-right: 1px solid rgba(255,255,255,.18); font-weight: 700; }
    .header-group { height: 40px; color: #fff; background: var(--navy); font-size: 13px; letter-spacing: .04em; }
    .header-group.index-head { grid-row: span 2; background: #fff; color: var(--muted); border-right: 1px solid var(--line); font-size: 12px; }
    .header-group.original-head { grid-row: span 2; background: #fff; color: var(--muted); border-right: 1px solid var(--line); }
    .header-group.online-head { grid-row: span 2; background: #fff; color: #2563eb; border-right: 1px solid var(--line); box-shadow: inset 0 3px #2563eb; }
    .header-group.model-head { grid-row: span 2; color: #fff; border-right: 1px solid rgba(255,255,255,.18); }
    .header-group.model-banana { background: #5e4c80; }
    .header-group.model-gpt { background: #34736b; }
    .header-group.model-gpt2 { background: #78623a; }
    .header-group.model-seedream { background: #a36a3c; }
    .header-group.low { grid-column: 4 / span 3; }
    .header-group.high { grid-column: 7 / span 3; border-left: 3px solid #bcc9d6; }
    .header-sub { height: 42px; color: #4f5e6c; background: #fbfcfd; border-right: 1px solid var(--line); border-top: 1px solid var(--line); font-size: 12px; }
    .header-sub.natural { color: #a83f36; box-shadow: inset 0 3px var(--coral); }
    .header-sub.warm { color: #8a6817; box-shadow: inset 0 3px #efbd45; }
    .header-sub.cool { color: #4f687f; box-shadow: inset 0 3px #9bafc1; }
    .header-sub.high-start { border-left: 3px solid #bcc9d6; }

    .scene-row { min-height: 190px; border-top: 1px solid var(--line); background: #fff; }
    .scene-row:nth-child(odd) { background: #fbfcfd; }
    .scene-index { display: flex; align-items: flex-start; justify-content: center; padding-top: 18px; color: #87929c; font-size: 14px; font-variant-numeric: tabular-nums; font-weight: 700; border-right: 1px solid var(--line); }
    .cell { min-width: 0; padding: clamp(5px, .7vw, 10px); border-right: 1px solid var(--line); }
    .cell.high-start { border-left: 3px solid #d4dde5; }
    .thumb-card { height: 100%; display: flex; flex-direction: column; gap: 8px; }
    .thumb-frame { position: relative; min-height: 0; flex: 1; overflow: hidden; border: 1px solid #dce4eb; border-radius: 6px; background: #e9edf1; }
    .thumb-frame img { display: block; width: 100%; height: 100%; min-height: clamp(72px, 10vw, 118px); object-fit: cover; transition: transform .2s ease, filter .2s ease; }
    .thumb-frame:hover img { transform: scale(1.025); }
    .thumb-label { position: absolute; left: 7px; top: 7px; padding: 3px 6px; color: #fff; background: rgba(19,29,39,.62); border-radius: 4px; font-size: 10px; line-height: 1; }
    .thumb-actions { display: flex; align-items: center; justify-content: flex-end; gap: 6px; min-height: 28px; }
    .thumb-actions button { min-height: 27px; padding: 4px 8px; border: 1px solid var(--line-strong); border-radius: 5px; color: #4f5c68; background: #fff; font-size: 11px; }
    .thumb-actions button:hover { border-color: #91a4b6; color: var(--navy); background: #f8fafc; }
    .thumb-actions .primary { color: #fff; background: var(--blue); border-color: var(--blue); }
    .thumb-actions .primary:hover { background: #1d4ed8; border-color: #1d4ed8; }
    .scene-row.is-hidden { display: none; }
    .statusbar { display: flex; justify-content: space-between; align-items: center; gap: 16px; padding: 10px 4px 0; color: var(--muted); font-size: 12px; }
    .legend { display: flex; gap: 14px; align-items: center; }
    .legend span { display: inline-flex; align-items: center; gap: 5px; }
    .legend i { width: 8px; height: 8px; border-radius: 50%; display: inline-block; }
    .legend .i-natural { background: var(--coral); }
    .legend .i-warm { background: #efbd45; }
    .legend .i-cool { background: #9bafc1; }

    .modal { position: fixed; inset: 0; display: none; place-items: center; padding: 18px; background: rgba(8, 13, 20, .68); z-index: 80; }
    .modal.open { display: grid; }
    .modal-panel { width: min(1500px, 100%); max-height: min(900px, 100%); display: flex; flex-direction: column; overflow: hidden; border: 1px solid #d8e0ea; border-radius: 8px; color: var(--ink); background: #fff; box-shadow: 0 26px 80px rgba(0,0,0,.3); }
    .modal-head { min-height: 56px; display: flex; align-items: center; gap: 12px; padding: 0 14px 0 18px; border-bottom: 1px solid var(--line); }
    .modal-head h2 { min-width: 0; margin: 0 auto 0 0; overflow: hidden; white-space: nowrap; text-overflow: ellipsis; font-size: 14px; }
    .modal-head button, .modal-control { height: 34px; padding: 0 10px; border: 1px solid var(--line-strong); border-radius: 6px; color: #3f4b56; background: #fff; font-size: 12px; font-weight: 700; }
    .modal-head button:hover, .modal-control:hover { background: #f6f8fa; }
    .modal-close { width: 34px; padding: 0 !important; font-size: 18px !important; }
    .modal-tools { display: flex; align-items: center; gap: 7px; }
    .modal-tools input { width: 110px; accent-color: var(--blue); }
    .modal-tools output { width: 32px; color: var(--muted); font-size: 12px; }
    .modal-body { min-height: 0; padding: 14px; overflow: auto; background: #f6f8fa; }
    .detail-grid { display: grid; grid-template-columns: repeat(4, minmax(170px, 1fr)); gap: 10px; }
    .detail-tile { min-width: 0; overflow: hidden; border: 1px solid var(--line); border-radius: 6px; background: #fff; }
    .detail-tile.wide { grid-column: span 2; }
    .detail-tile h3 { margin: 0; padding: 8px 10px; color: #5f6c78; font-size: 11px; border-bottom: 1px solid var(--line); }
    .detail-viewport { height: 250px; overflow: hidden; background: #101820; }
    .detail-viewport img { width: 100%; height: 100%; object-fit: cover; transform-origin: center; transition: transform .14s ease; }
    .compare-grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 14px; }
    .compare-card { overflow: hidden; border: 1px solid var(--line); border-radius: 6px; background: #fff; }
    .compare-card h3 { margin: 0; padding: 10px 12px; font-size: 12px; color: #5f6c78; border-bottom: 1px solid var(--line); }
    .compare-card img { display: block; width: 100%; max-height: 600px; object-fit: contain; background: #101820; }
    .single-image { display: grid; place-items: center; min-height: 420px; background: #101820; }
    .single-image img { display: block; max-width: 100%; max-height: 70vh; object-fit: contain; }
    .empty { padding: 60px 20px; text-align: center; color: var(--muted); }

    @media (max-width: 1100px) {
      .matrix-shell { width: max-content; min-width: 894px; }
      .matrix-header, .scene-row { grid-template-columns: 54px repeat(8, 105px); }
      .matrix-shell.third-party { width: max-content; min-width: 864px; }
      .matrix-header.third-party, .scene-row.third-party { grid-template-columns: 54px repeat(6, 135px); }
    }

    @media (max-width: 820px) {
      .topbar { align-items: flex-start; flex-direction: column; gap: 10px; padding: 14px 16px; }
      .toolbar { width: 100%; justify-content: space-between; }
      .search { flex: 1; max-width: 210px; }
      .workspace { padding: 12px; }
      .matrix-shell { min-width: 894px; }
      .matrix-shell.third-party { min-width: 864px; }
      .detail-grid { grid-template-columns: repeat(2, minmax(150px, 1fr)); }
      .detail-tile.wide { grid-column: span 2; }
      .compare-grid { grid-template-columns: 1fr; }
    }
  </style>
</head>
<body>
  <main class="app">
    <header class="topbar">
      <div class="brand">
        <div class="brand-mark" aria-hidden="true">▦</div>
        <div>
          <h1>影像版本评审 · 多模式对比</h1>
          <p>Flux版本 · 同一场景横向检查不同增强模式</p>
        </div>
      </div>
      <div class="toolbar">
        <div class="segmented" role="tablist" aria-label="效果版本">
          <button class="active" data-dataset="4K" role="tab" aria-selected="true">Flux版本</button>
          <button data-dataset="THIRD" role="tab" aria-selected="false">三方大模型</button>
        </div>
        <label class="search" aria-label="搜索场景">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="6.5"></circle><path d="m16 16 4.5 4.5"></path></svg>
          <input id="search" type="search" placeholder="搜索编号或场景">
        </label>
      </div>
    </header>

    <section class="workspace">
      <div class="matrix-shell">
        <div class="matrix-header" id="matrix-header" aria-label="对比表头">
          <div class="header-group index-head">序号</div>
          <div class="header-group original-head">原图</div>
          <div class="header-group online-head">建筑学长</div>
          <div class="header-group low">低强度</div>
          <div class="header-group high">高强度</div>
          <div class="header-sub natural">自然调</div>
          <div class="header-sub warm">暖调</div>
          <div class="header-sub cool">冷调</div>
          <div class="header-sub natural high-start">自然调</div>
          <div class="header-sub warm">暖调</div>
          <div class="header-sub cool">冷调</div>
        </div>
        <div id="rows"></div>
      </div>
      <div class="statusbar">
        <span id="count">已显示 25 / 25 组</span>
        <div class="legend" aria-label="色调图例">
          <span><i class="i-natural"></i>自然</span>
          <span><i class="i-warm"></i>暖调</span>
          <span><i class="i-cool"></i>冷调</span>
        </div>
      </div>
    </section>
  </main>

  <div id="modal" class="modal" role="dialog" aria-modal="true" aria-label="图像查看器">
    <div class="modal-panel">
      <div class="modal-head">
        <h2 id="modal-title">图像查看器</h2>
        <div id="modal-tools" class="modal-tools"></div>
        <button class="modal-close" id="modal-close" aria-label="关闭">×</button>
      </div>
      <div id="modal-body" class="modal-body"></div>
    </div>
  </div>

  <script>
    (() => {
      const columns = [
        ["original", "原图", ""],
        ["online", "建筑学长", "online"],
        ["low-default", "低强度·自然调", "natural"],
        ["low-warm", "低强度·暖调", "warm"],
        ["low-cool", "低强度·冷调", "cool"],
        ["high-default", "高强度·自然调", "natural"],
        ["high-warm", "高强度·暖调", "warm"],
        ["high-cool", "高强度·冷调", "cool"]
      ];
      const thirdPartyColumns = [
        ["original", "原图", ""],
        ["online", "建筑学长", "online"],
        ["banana2", "Banan2", "model"],
        ["gptimage2", "gptimage2", "model"],
        ["gptimage25", "gptimage 2.5", "model"],
        ["seedream50", "seedream5.0 pro", "model"]
      ];
      const assetIds = ["003", "004", "005", "007", "012", "013", "016", "018", "020", "022", "023", "027", "029", "036", "037", "038", "040", "042", "043", "044", "045", "046", "048", "049", "050"];
      const sceneKinds = ["room", "coast", "forest", "city", "still", "portrait", "street", "mountain", "table", "night", "building", "road", "garden", "gallery", "oldtown", "blue", "kitchen", "plant"];
      const filters = {
        original: "none",
        online: "contrast(1.08) saturate(1.08)",
        "low-default": "saturate(1.04) contrast(1.02)",
        "low-warm": "sepia(.14) saturate(1.15) contrast(1.02)",
        "low-cool": "hue-rotate(12deg) saturate(.9) contrast(1.02)",
        "high-default": "contrast(1.16) saturate(1.12)",
        "high-warm": "sepia(.24) saturate(1.18) contrast(1.12)",
        "high-cool": "hue-rotate(15deg) saturate(1.04) contrast(1.16)",
        banana2: "none",
        gptimage25: "none",
        gptimage2: "none",
        seedream50: "none"
      };
      const assetFolders = { original: "original", online: "online", "low-default": "offline/low-default", "low-warm": "offline/low-warm", "low-cool": "offline/low-cool", "high-default": "offline/high-default", "high-warm": "offline/high-warm", "high-cool": "offline/high-cool", banana2: "third-party/banana2", gptimage25: "third-party/gptimage25", gptimage2: "third-party/gptimage2", seedream50: "third-party/seedream50" };
      const missingOnline = new Set();
      const rows = assetIds.map((id, index) => ({ id, name: `测试集 ${id}`, kind: sceneKinds[index % sceneKinds.length], mode: "4K" }));
      const rowHost = document.querySelector("#rows");
      const matrixShell = document.querySelector(".matrix-shell");
      const matrixHeader = document.querySelector("#matrix-header");
      const count = document.querySelector("#count");
      const search = document.querySelector("#search");
      const modal = document.querySelector("#modal");
      const modalTitle = document.querySelector("#modal-title");
      const modalBody = document.querySelector("#modal-body");
      const modalTools = document.querySelector("#modal-tools");
      let dataset = "4K";

      function escapeHtml(value) {
        return String(value).replace(/[&<>"']/g, char => ({"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#039;"}[char]));
      }

      function svgScene(kind, variant, index) {
        const palettes = {
          room: ["#b8cad0", "#f0d6b3"], coast: ["#87aec0", "#d9c08b"], forest: ["#52715e", "#c3aa73"], city: ["#566778", "#d49469"], still: ["#d8d1c2", "#8b5d43"], portrait: ["#d1b3a3", "#4f5966"], street: ["#6e7780", "#cf9e76"], mountain: ["#7891a1", "#9c9b88"], table: ["#d0b894", "#6f4731"], night: ["#273d5c", "#d57f52"], building: ["#cbd1d2", "#637988"], road: ["#9aa2a7", "#d6bd8c"], garden: ["#84a06d", "#d0b474"], gallery: ["#d7d9d6", "#9a6d59"], oldtown: ["#b58e6b", "#50616c"], blue: ["#486e8c", "#9dbdd0"], kitchen: ["#d7c4a0", "#62757b"], plant: ["#9ab28f", "#d9bf91"]
        };
        const p = palettes[kind] || palettes.room;
        const n = index + 1;
        const sky = kind === "night" || kind === "blue" ? "#1f3650" : p[0];
        const accent = p[1];
        let content = `<rect width="640" height="360" fill="${sky}"/><rect y="230" width="640" height="130" fill="${accent}" opacity=".92"/>`;
        if (["coast", "mountain", "road", "blue"].includes(kind)) {
          content += `<path d="M0 245 125 160 215 224 330 118 470 230 548 154 640 216V360H0Z" fill="#3c5967" opacity=".72"/><path d="M0 267 150 202 258 270 390 194 520 259 640 190V360H0Z" fill="#738c7f" opacity=".78"/>`;
        }
        if (["city", "street", "oldtown", "building", "night"].includes(kind)) {
          for (let b = 0; b < 6; b++) content += `<rect x="${30 + b * 103}" y="${110 + ((b + n) % 3) * 22}" width="72" height="${145 - ((b + n) % 3) * 18}" rx="3" fill="${b % 2 ? "#354858" : "#e1c2a1"}" opacity=".9"/><g fill="#f2d384">${[0,1,2].map(w => `<rect x="${43 + b * 103 + w * 20}" y="${140 + ((b + n) % 3) * 22}" width="9" height="15" rx="2"/>`).join("")}</g>`;
        }
        if (["forest", "garden", "plant"].includes(kind)) {
          for (let t = 0; t < 10; t++) content += `<path d="M${30 + t * 62} 285 Q${48 + t * 62} ${188 - (t % 3) * 15} ${78 + t * 62} 276" stroke="#294a3c" stroke-width="9" fill="none"/><circle cx="${45 + t * 62}" cy="${212 - (t % 3) * 15}" r="28" fill="${t % 2 ? "#6c8f5d" : "#416d54"}"/>`;
        }
        if (["room", "still", "portrait", "table", "kitchen", "gallery"].includes(kind)) {
          content += `<rect x="80" y="65" width="480" height="205" rx="7" fill="#efe8db" opacity=".9"/><rect x="120" y="92" width="150" height="120" fill="#839eab" opacity=".85"/><circle cx="195" cy="145" r="35" fill="#d8b17c" opacity=".85"/><rect x="318" y="148" width="125" height="74" rx="12" fill="#7d5546"/><circle cx="382" cy="125" r="30" fill="#d7a783"/>`;
        }
        if (["coast", "mountain", "road", "city", "street"].includes(kind)) content += `<path d="M0 280 Q160 ${230 + n % 4 * 10} 320 274 T640 260V360H0Z" fill="#d7ddd8" opacity=".72"/>`;
        content += `<circle cx="${88 + (n * 53) % 470}" cy="${54 + (n * 11) % 45}" r="28" fill="#f6d98b" opacity=".9"/><text x="24" y="330" fill="#fff" font-size="16" font-family="Arial" opacity=".74">SCENE ${String(n).padStart(2,"0")}</text>`;
        return "data:image/svg+xml;charset=UTF-8," + encodeURIComponent(`<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360">${content}</svg>`);
      }

      function missingImage(label) {
        const svg = `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360"><rect width="640" height="360" fill="#edf1f4"/><path d="M270 130h100v100H270z" fill="none" stroke="#9aa8b5" stroke-width="8"/><path d="m285 215 25-28 20 20 26-32 30 40" fill="none" stroke="#9aa8b5" stroke-width="7"/><text x="320" y="275" text-anchor="middle" fill="#647383" font-size="22" font-family="Arial,Microsoft YaHei">${label}</text></svg>`;
        return `data:image/svg+xml;charset=UTF-8,${encodeURIComponent(svg)}`;
      }

      function imageFor(row, column) {
        if (column === "online" && missingOnline.has(row.id)) return missingImage("暂无线上结果");
        return `assets/${assetFolders[column]}/${row.id}.jpg`;
      }

      function activeColumns() { return dataset === "THIRD" ? thirdPartyColumns : columns; }

      function renderHeader() {
        const isThirdParty = dataset === "THIRD";
        matrixShell.classList.toggle("third-party", isThirdParty);
        matrixHeader.classList.toggle("third-party", isThirdParty);
        matrixHeader.innerHTML = isThirdParty
          ? `<div class="header-group index-head">序号</div><div class="header-group original-head">原图</div><div class="header-group online-head">建筑学长</div><div class="header-group model-head model-banana">Banan2</div><div class="header-group model-head model-gpt2">gptimage2</div><div class="header-group model-head model-gpt">gptimage 2.5</div><div class="header-group model-head model-seedream">seedream5.0 pro</div>`
          : `<div class="header-group index-head">序号</div><div class="header-group original-head">原图</div><div class="header-group online-head">建筑学长</div><div class="header-group low">低强度</div><div class="header-group high">高强度</div><div class="header-sub natural">自然调</div><div class="header-sub warm">暖调</div><div class="header-sub cool">冷调</div><div class="header-sub natural high-start">自然调</div><div class="header-sub warm">暖调</div><div class="header-sub cool">冷调</div>`;
      }

      function render() {
        const term = search.value.trim().toLowerCase();
        const visible = rows.filter(row => `${row.id} ${row.name} ${row.mode}`.toLowerCase().includes(term));
        const currentColumns = activeColumns();
        rowHost.innerHTML = visible.length ? visible.map(row => {
          const cells = currentColumns.map(([key, label]) => {
            const isOriginal = key === "original";
            const isHigh = key.startsWith("high");
            const actions = isOriginal
              ? `<button class="primary" data-action="detail" data-id="${row.id}">细节对比</button>`
              : `<button data-action="original" data-id="${row.id}" data-column="${key}">原图对比</button>${isHigh ? `<button data-action="intensity" data-id="${row.id}" data-column="${key}">强度对比</button>` : ""}`;
            return `<div class="cell ${isHigh && key === "high-default" ? "high-start" : ""}"><div class="thumb-card"><div class="thumb-frame"><img src="${imageFor(row, key)}" alt="${escapeHtml(row.name)} ${escapeHtml(label)}" style="filter:${filters[key]}"><span class="thumb-label">${escapeHtml(label)}</span></div><div class="thumb-actions">${actions}</div></div></div>`;
          }).join("");
          return `<div class="scene-row ${dataset === "THIRD" ? "third-party" : ""}" data-id="${row.id}"><div class="scene-index">${row.id}</div>${cells}</div>`;
        }).join("") : `<div class="empty">没有找到匹配的场景</div>`;
        count.textContent = `已显示 ${visible.length} / ${rows.length} 组`;
      }

      function rowById(id) { return rows.find(row => row.id === id); }
      function openModal(title, body, tools = "") { modalTitle.textContent = title; modalBody.innerHTML = body; modalTools.innerHTML = tools; modal.classList.add("open"); document.body.style.overflow = "hidden"; }
      function closeModal() { modal.classList.remove("open"); modalBody.innerHTML = ""; modalTools.innerHTML = ""; document.body.style.overflow = ""; }

      function openDetail(row) {
        const currentColumns = activeColumns();
        const tiles = currentColumns.map(([key, label], i) => `<article class="detail-tile ${i === 0 ? "wide" : ""}"><h3>${escapeHtml(label)}</h3><div class="detail-viewport"><img data-zoom-image src="${imageFor(row,key)}" alt="${escapeHtml(row.name)} ${escapeHtml(label)}" style="filter:${filters[key]}"></div></article>`).join("");
        const tools = `<span style="font-size:11px;color:#71808f">同步缩放</span><input id="zoom" type="range" min="1" max="2.4" step=".1" value="1" aria-label="同步缩放"><output id="zoom-output">100%</output><button class="modal-control" id="reset-zoom">重置</button>`;
        openModal(`${row.id} · ${row.name} · ${currentColumns.length}图细节对比`, `<div class="detail-grid">${tiles}</div>`, tools);
        const slider = document.querySelector("#zoom");
        const output = document.querySelector("#zoom-output");
        const applyZoom = () => { const value = Number(slider.value); output.value = `${Math.round(value * 100)}%`; output.textContent = `${Math.round(value * 100)}%`; document.querySelectorAll("[data-zoom-image]").forEach(img => { img.style.transform = `scale(${value})`; }); };
        slider.addEventListener("input", applyZoom);
        document.querySelector("#reset-zoom").addEventListener("click", () => { slider.value = "1"; applyZoom(); });
      }

      function openCompare(row, column, mode) {
        const current = activeColumns().find(item => item[0] === column);
        const title = mode === "intensity" ? `${row.id} · ${row.name} · 强度对比` : `${row.id} · ${row.name} · 原图对比`;
        const compareColumn = mode === "intensity" ? (column.startsWith("high") ? column.replace("high", "low") : "low-default") : "original";
        const compareLabel = activeColumns().find(item => item[0] === compareColumn)[1];
        const body = `<div class="compare-grid"><article class="compare-card"><h3>${escapeHtml(compareLabel)}</h3><img src="${imageFor(row,compareColumn)}" alt="${escapeHtml(compareLabel)}" style="filter:${filters[compareColumn]}"></article><article class="compare-card"><h3>${escapeHtml(current[1])}</h3><img src="${imageFor(row,column)}" alt="${escapeHtml(current[1])}" style="filter:${filters[column]}"></article></div>`;
        openModal(title, body);
      }

      function openSingle(row, column) {
        const label = columns.find(item => item[0] === column)[1];
        openModal(`${row.id} · ${row.name} · ${label}`, `<div class="single-image"><img src="${imageFor(row,column)}" alt="${escapeHtml(row.name)} ${escapeHtml(label)}" style="filter:${filters[column]}"></div>`);
      }

      rowHost.addEventListener("click", event => {
        const button = event.target.closest("button");
        const image = event.target.closest("img");
        const card = event.target.closest(".thumb-frame");
        if (!button && !image && !card) return;
        const cell = event.target.closest(".cell");
        const row = rowById(event.target.closest(".scene-row").dataset.id);
        const column = cell ? columns[Array.from(cell.parentElement.children).indexOf(cell) - 1]?.[0] : "original";
        if (button) {
          const action = button.dataset.action;
          if (action === "detail") openDetail(row);
          if (action === "original") openCompare(row, button.dataset.column, "original");
          if (action === "intensity") openCompare(row, button.dataset.column, "intensity");
        } else openSingle(row, column);
      });

      document.querySelectorAll("[data-dataset]").forEach(button => button.addEventListener("click", () => {
        document.querySelectorAll("[data-dataset]").forEach(item => { item.classList.toggle("active", item === button); item.setAttribute("aria-selected", item === button ? "true" : "false"); });
        dataset = button.dataset.dataset;
        document.querySelector(".brand p").textContent = `${dataset === "THIRD" ? "三方大模型" : "Flux版本"} · 同一场景横向检查不同增强模式`;
        renderHeader();
        render();
      }));
      search.addEventListener("input", render);
      document.querySelector("#modal-close").addEventListener("click", closeModal);
      modal.addEventListener("click", event => { if (event.target === modal) closeModal(); });
      document.addEventListener("keydown", event => { if (event.key === "Escape") closeModal(); });
      renderHeader();
      render();
    })();
  </script>
</body>
</html>
